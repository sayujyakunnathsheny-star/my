<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For You</title>
    <style>
        body { margin: 0; background: #0a111c; overflow: hidden; }
        canvas { display: block; }
        
        /* 完美修复居中偏位问题，不改变任何字体和色彩 */
        #missText {
            position: absolute;
            top: 48%;
            left: 0;         /* 修改点1：从最左侧开始计算 */
            width: 100%;     /* 修改点2：撑满屏幕宽度，确保100%绝对居中 */
            box-sizing: border-box;
            padding: 0 10px; /* 防止极小屏幕贴边 */
            color: #89CFF0; 
            -webkit-text-stroke: 2.5px #ffffff; 
            font-family: 'Arial Rounded MT Bold', 'Baloo', 'Comic Sans MS', sans-serif;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 2px;
            pointer-events: none;
            text-align: center; /* 修改点3：让文本内容在100%容器内完美内居中 */
            white-space: nowrap;
            text-shadow: 0px 4px 8px rgba(0, 0, 0, 0.4);
            /* 将水平居中交给 text-align，这里动画只负责上下浮动，防止位图冲突 */
            animation: float 3s ease-in-out infinite; 
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>
    <div id="missText"></div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height, elements = [];
        const HEART_COLOR = '#89CFF0'; 
        const HEART_BACK_COLOR = '#5dade2'; 

        const emojis = ['☁️', '✨', '🧸', '🥺'];
        const fullText = "🤍 I miss you 🤍";

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            elements = [];
            
            for (let i = 0; i < 25; i++) {
                elements.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 10 + 14, 
                    speedX: Math.random() * 0.8 - 0.4,
                    speedY: Math.random() * 0.5 + 0.5,
                    angle: Math.random() * Math.PI * 2,
                    vAngle: Math.random() * 0.01,
                    char: emojis[Math.floor(Math.random() * emojis.length)]
                });
            }
        }

        function drawHeart(ctx, x, y, size, rotationY) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(Math.cos(rotationY), 1); 
            
            ctx.beginPath();
            ctx.moveTo(0, 2);
            ctx.bezierCurveTo(-size / 1.5, -size / 1.5 + 2, -size * 1.2, size / 3 + 2, 0, size + 2);
            ctx.bezierCurveTo(size * 1.2, size / 3 + 2, size / 1.5, -size / 1.5 + 2, 0, 2);
            ctx.fillStyle = HEART_BACK_COLOR;
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-size / 1.5, -size / 1.5, -size * 1.2, size / 3, 0, size);
            ctx.bezierCurveTo(size * 1.2, size / 3, size / 1.5, -size / 1.5, 0, 0);
            ctx.fillStyle = HEART_COLOR;
            ctx.fill();

            ctx.restore();
        }

        let textIndex = 0;
        let startTyping = false;
        let lastTypeTime = 0;
