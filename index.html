<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For You</title>
    <style>
        body { margin: 0; background: #0a111c; overflow: hidden; }
        canvas { display: block; }
        
        /* 核心：包裹双层字体的容器，确保100%死死居中，不偏位 */
        .text-container {
            position: absolute;
            top: 48%;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            padding: 0 10px;
            pointer-events: none;
            animation: float 3s ease-in-out infinite; 
        }

        /* 纯白底色字：充当3D泡泡字的外边框，彻底杜绝黑屏 */
        #shadowText {
            color: #ffffff;
            font-family: 'Arial Rounded MT Bold', 'Baloo', 'Comic Sans MS', sans-serif;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 2px;
            text-align: center;
            white-space: nowrap;
            /* 用密集的微小阴影把它撑得更圆润，形成白边 */
            text-shadow: 
                -2px -2px 0 #ffffff,  2px -2px 0 #ffffff,
                -2px  2px 0 #ffffff,  2px  2px 0 #ffffff,
                -2px  0px 0 #ffffff,  2px  0px 0 #ffffff,
                 0px -2px 0 #ffffff,  0px  2px 0 #ffffff,
                 0px  5px 8px rgba(0, 0, 0, 0.5);
        }

        /* 婴儿蓝字：精准盖在正上方，形成内填充 */
        #fillText {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
            color: #89CFF0; /* 纯正 Baby Blue */
            font-family: 'Arial Rounded MT Bold', 'Baloo', 'Comic Sans MS', sans-serif;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 2px;
            text-align: center;
            white-space: nowrap;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>
    <div class="text-container">
        <div id="shadowText"></div>
        <div id="fillText"></div>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height, elements = [];
        const HEART_COLOR = '#89CFF0'; 
        const HEART_BACK_COLOR = '#5dade2'; 

        const emojis = ['☁️', '✨', '🧸', '🥺'];
        const fullText = "🤍 I miss you 🤍";

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            elements = [];
            
            for (let i = 0; i < 25; i++) {
                elements.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 10 + 14, 
                    speedX: Math.random() * 0.8 - 0.4,
                    speedY: Math.random() * 0.5 + 0.5,
                    angle: Math.random() * Math.PI * 2,
                    vAngle: Math.random() * 0.01,
                    char: emojis[Math.floor(Math.random() * emojis.length)]
                });
            }
        }

        function drawHeart(ctx, x, y, size, rotationY) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(Math.cos(rotationY), 1); 
            
            ctx.beginPath();
            ctx.moveTo(0, 2);
            ctx.bezierCurveTo(-size / 1.5, -size / 1.5 + 2, -size * 1.2, size / 3 + 2, 0, size + 2);
            ctx.bezierCurveTo(size * 1.2, size / 3 + 2, size / 1.5, -size / 1.5 + 2, 0, 2);
            ctx.fillStyle = HEART_BACK_COLOR;
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-size / 1.5, -size / 1.5, -size * 1.2, size / 3, 0, size);
            ctx.bezierCurveTo(size * 1.2, size / 3, size / 1.5, -size / 1.5, 0, 0);
            ctx.fillStyle = HEART_COLOR;
            ctx.fill();

            ctx.restore();
        }

        let startTime = Date.now();
        let textIndex = 0;
        let startTyping = false;
        let lastTypeTime = 0;

        function render() {
            ctx.fillStyle = 'rgba(10, 17, 28, 0.2)'; 
            ctx.fillRect(0, 0, width, height);

            const now = Date.now();
            const time = (now - startTime) * 0.002;
            
            // 1. 绘制背景 Emoji
            elements.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                ctx.font = `${p.size}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.globalAlpha = 0.4; 
                ctx.fillText(p.char, 0, 0);
                ctx.restore();

                p.x += p.speedX;
                p.y += p.speedY;
                p.angle += p.vAngle;
                if (p.y > height) {
                    p.y = -20;
                    p.x = Math.random() * width;
                }
            });

            // 2. 有清晰停顿感的心跳（保持原样）
            const bpm = 65; 
            const beatDuration = 60000 / bpm; 
            const elapsed = (now - startTime) % beatDuration; 
            
            let pulseScale = 0;
            if (elapsed < 120) {
                pulseScale = Math.sin((elapsed / 120) * (Math.PI / 2)) * 25;
            } else if (elapsed < 240) {
                pulseScale = 25 - Math.sin(((elapsed - 120) / 120) * (Math.PI / 2)) * 15;
            } else if (elapsed < 360) {
                pulseScale = 10 + Math.sin(((elapsed - 240) / 120) * Math.PI) * 5;
            } else {
                pulseScale = 10;
            }

            const pulse = 145 + pulseScale;
            const rotationY = time * 0.9; 
            drawHeart(ctx, width / 2, height / 2 - 60, pulse, rotationY);

            // 3. 双层打字机同步注入逻辑
            if (!startTyping && (now - startTime) > 1000) {
                startTyping = true;
                lastTypeTime = now;
            }

            if (startTyping && textIndex < fullText.length) {
                if (now - lastTypeTime > 160) {
                    let currentStr = "";
                    if (fullText.substr(textIndex, 2) === "🤍") {
                        currentStr = fullText.substr(0, textIndex + 2);
                        textIndex += 2;
                    } else {
                        currentStr = fullText.substr(0, textIndex + 1);
                        textIndex += 1;
                    }
                    // 让两层文字内容绝对同步敲出来
                    document.getElementById('shadowText').innerText = currentStr;
                    document.getElementById('fillText').innerText = currentStr;
                    lastTypeTime = now;
                }
            }

            requestAnimationFrame(render);
        }

        window.addEventListener('resize', init);
        init();
        render();
    </script>
</body>
</html>
